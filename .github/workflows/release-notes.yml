name: Release Notes

# 打 tag（v*）时自动基于 tag 间的提交生成 Release Notes 并发布 Release。
# 不需要手写明稿：gh 会汇总上一个 tag 到当前 tag 的提交。
# 权限：contents:write 用于创建 Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史才能生成 notes

      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
